name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install repository tools
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: make test
      - name: Audit public source boundary
        run: make audit
      - name: Build deterministic archives
        run: make package
