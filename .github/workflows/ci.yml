name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest -q

  packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package-version: ["v1", "v2", "v3"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: versions/${{ matrix.package-version }}/pyproject.toml
      - name: Install selected generation
        run: python -m pip install -e versions/${{ matrix.package-version }}
      - name: Verify installed namespace
        run: python -c "import DanKS; print(DanKS.__file__)"
      - name: Run retrieval example
        run: python examples/retrieval_quickstart.py --version ${{ matrix.package-version }}

  v3-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: versions/v3/pyproject.toml
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install V3
        run: python -m pip install -e versions/v3
      - name: Run model forward smoke test
        run: python examples/v3_model_smoke.py
      - name: Run PPO update smoke test
        run: python examples/v3_ppo_smoke.py
      - name: Verify PPO entry point
        run: python -m DanKS.training.train_ppo --help

  native-kernels:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: versions/v3/pyproject.toml
      - name: Install V3 build dependencies
        run: python -m pip install -e versions/v3
      - name: Build C++ kernels
        working-directory: versions/v3/DanKS/retrieval/native_cpp
        run: python setup.py build_ext --inplace
      - name: Verify native imports
        run: python -c "from DanKS.retrieval.native_cover import available; from DanKS.retrieval.native_actor_core import available as actor_available; assert available() and actor_available()"
