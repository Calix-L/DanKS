[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "danks-v3pro"
version = "0.1.0"
description = "Inference-only V3 enhancements: asset gate, equivalent plays, and verified endgame search"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["danks-v3==0.1.0", "danks-engine==0.1.0"]

[project.optional-dependencies]
inference = ["torch>=2.8"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["DanKSPro*"]
namespaces = false
