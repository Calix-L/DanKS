[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "danks-v2"
version = "0.1.0"
description = "DanKS V2 retrieval and ONNX selector"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "numpy==2.4.6",
  "onnxruntime==1.27.0",
  "flatbuffers==23.5.26",
  "packaging==26.2",
  "protobuf==7.35.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["DanKS*"]
